services:
  api:
    build: .
    container_name: devops-copilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      DATABASE_URL: sqlite+aiosqlite:////app/data/devops_copilot.db
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - copilot-data:/app/data
    restart: unless-stopped

  # Optional local Redis stand-in notes: Upstash is used in production free tier.
  # Kept out of default compose to stay lean for Project 1.

volumes:
  copilot-data:
