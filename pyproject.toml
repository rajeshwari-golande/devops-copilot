[project]
name = "devops-copilot"
version = "0.1.0"
description = "AI agent for CI/CD failure diagnosis and safe auto-remediation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajeshwari Golande" }]
keywords = ["devops", "ci-cd", "langchain", "langgraph", "rag", "fastapi", "groq"]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "langchain>=0.3.0",
  "langchain-groq>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
  "python-multipart>=0.0.12",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
